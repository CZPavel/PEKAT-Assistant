name: Validate public edition
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_packages.py --check
      - run: python scripts/validate_public.py --index
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release_artifacts.py --ref "$GITHUB_SHA" --output dist
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: public-release-candidate
          path: dist/
