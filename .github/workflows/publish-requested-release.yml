name: Publish requested public release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_packages.py --check
      - run: python scripts/validate_public.py --index
      - run: python -m unittest discover -s tests -v
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < RELEASE_VERSION.txt)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-public-preview$ ]]; then
            echo "Unexpected release version: $version" >&2
            exit 1
          fi
          python scripts/build_release_artifacts.py --ref "$version" --output dist
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; uploading rebuilt assets."
            gh release upload "$version" dist/* --clobber
          else
            gh release create "$version" dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$version — Public preview" \
              --generate-notes
          fi
