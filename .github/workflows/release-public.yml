name: Build public release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_packages.py --check
      - run: python scripts/validate_public.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release_artifacts.py --ref "$GITHUB_REF_NAME" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: "$GITHUB_REF_NAME-artifacts"
          path: dist/
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
